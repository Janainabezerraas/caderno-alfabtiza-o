<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga-Letras — Jogo de Alfabetização</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFEBFF;
    --sky-bottom:#FFF3D6;
    --ink:#2B3A55;
    --sun:#FFC93C;
    --sun-dark:#F2A900;
    --success:#3FC380;
    --error:#FF6B6B;
    --coral:#FF8A65;
    --teal:#2EC4B6;
    --purple:#9B6EF3;
    --blue:#4C9AFF;
    --card:#FFFDF7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Fredoka', system-ui, sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
    overflow-x:hidden;
  }

  /* soft floating clouds in the background */
  .cloud{
    position:fixed;
    background:#fff;
    opacity:.55;
    border-radius:50%;
    filter:blur(1px);
    z-index:0;
  }

  header{
    text-align:center;
    max-width:560px;
    z-index:1;
  }
  h1{
    font-size:clamp(28px,5vw,40px);
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:.5px;
  }
  h1 span{color:var(--sun-dark);}
  p.instructions{
    margin:0 0 18px;
    font-size:clamp(15px,2.4vw,18px);
    font-weight:500;
    color:#4A5A78;
  }

  .letter-picker{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:640px;
    margin-bottom:22px;
    z-index:1;
  }
  .letter-chip{
    font-family:inherit;
    font-weight:600;
    font-size:18px;
    width:42px;
    height:42px;
    border-radius:14px;
    border:2px solid #fff;
    background:#ffffffb0;
    color:var(--ink);
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .letter-chip:hover{transform:translateY(-2px);}
  .letter-chip.active{
    background:var(--sun);
    border-color:var(--sun-dark);
    box-shadow:0 4px 0 var(--sun-dark);
    transform:translateY(-2px);
  }

  .score-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:14px;
    font-weight:600;
    font-size:16px;
    z-index:1;
  }
  .score-pill{
    background:#ffffffcc;
    padding:6px 14px;
    border-radius:999px;
    border:2px solid #fff;
  }

  #playfield-wrap{
    position:relative;
    width:min(94vw, 560px);
    aspect-ratio:1/1;
    z-index:1;
  }
  #playfield{
    position:absolute;
    inset:0;
  }
  #lines-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
  }
  #lines-svg line{
    stroke:var(--success);
    stroke-width:6;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .25s ease;
  }
  #lines-svg line.show{opacity:1;}

  .center-letter{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:22%;
    aspect-ratio:1/1;
    min-width:84px;
    min-height:84px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE58A, var(--sun) 70%);
    border:5px solid var(--sun-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(38px,8vw,64px);
    font-weight:700;
    color:#7A4A00;
    box-shadow:0 6px 0 var(--sun-dark);
    z-index:3;
    user-select:none;
  }
  .center-letter.pulse{ animation:pulse .5s ease; }
  @keyframes pulse{
    0%{transform:translate(-50%,-50%) scale(1);}
    40%{transform:translate(-50%,-50%) scale(1.12);}
    100%{transform:translate(-50%,-50%) scale(1);}
  }

  .word-bubble{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    width:104px;
    height:88px;
    border-radius:46% 54% 52% 48%/54% 44% 56% 46%;
    background:var(--card);
    border:4px solid var(--bubble-color, var(--blue));
    font-family:inherit;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    z-index:2;
    transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .word-bubble .emoji{font-size:26px; line-height:1;}
  .word-bubble:hover{transform:translate(-50%,-50%) scale(1.06);}
  .word-bubble.correct{
    background:#E4FBEF;
    border-color:var(--success);
    cursor:default;
    pointer-events:none;
  }
  .word-bubble.correct::after{
    content:"✓";
    position:absolute;
    top:-10px;
    right:-6px;
    background:var(--success);
    color:#fff;
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    border:2px solid #fff;
  }
  .word-bubble.wrong{
    animation:shake .4s ease;
    border-color:var(--error);
    background:#FFEDEC;
  }
  @keyframes shake{
    0%,100%{transform:translate(-50%,-50%) rotate(0);}
    20%{transform:translate(-50%,-50%) rotate(-8deg);}
    40%{transform:translate(-50%,-50%) rotate(8deg);}
    60%{transform:translate(-50%,-50%) rotate(-6deg);}
    80%{transform:translate(-50%,-50%) rotate(6deg);}
  }

  #celebrate-overlay{
    position:fixed;
    inset:0;
    background:rgba(43,58,85,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:10;
  }
  #celebrate-overlay.show{display:flex;}
  .celebrate-card{
    background:var(--card);
    border-radius:32px;
    padding:36px 32px;
    text-align:center;
    max-width:340px;
    box-shadow:0 10px 0 #E8DFC7;
    position:relative;
    overflow:hidden;
  }
  .celebrate-card h2{margin:6px 0 4px; font-size:26px;}
  .celebrate-card p{margin:0 0 20px; color:#4A5A78; font-weight:500;}
  .big-emoji{font-size:56px;}
  .next-btn{
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    padding:12px 26px;
    border-radius:16px;
    border:none;
    background:var(--success);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #29976A;
  }
  .next-btn:active{transform:translateY(3px); box-shadow:none;}

  .confetto{
    position:absolute;
    top:-10px;
    width:10px;
    height:14px;
    opacity:.9;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(320px) rotate(360deg); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  footer{
    margin-top:26px;
    font-size:13px;
    color:#5C6E8C;
    z-index:1;
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <h1>Liga-<span>Letras</span></h1>
  <p class="instructions">Toque na letra para escolher, depois ligue todas as palavras que começam com ela!</p>
</header>

<div class="letter-picker" id="letterPicker"></div>

<div class="score-row">
  <div class="score-pill" id="progressPill">0 de 0 encontradas</div>
  <div class="score-pill" id="scorePill">⭐ 0</div>
</div>

<div id="playfield-wrap">
  <svg id="lines-svg"></svg>
  <div id="playfield">
    <div class="center-letter" id="centerLetter">A</div>
  </div>
</div>

<footer>Toque nas palavras certas para ligá-las à letra do meio 🎈</footer>

<div id="celebrate-overlay">
  <div class="celebrate-card">
    <div class="big-emoji">🎉</div>
    <h2>Muito bem!</h2>
    <p>Você ligou todas as palavras certas!</p>
    <button class="next-btn" id="nextBtn">Próxima letra</button>
  </div>
</div>

<script>
const BUBBLE_COLORS = ['#FF8A65','#2EC4B6','#9B6EF3','#4C9AFF','#F4A300','#FF6B9D'];

const BANK = {
  A: { correct:[['Abelha','🐝'],['Amora','🫐'],['Anel','💍'],['Aranha','🕷️']],
       distract:[['Bola','⚽'],['Casa','🏠'],['Dado','🎲'],['Gato','🐱']] },
  B: { correct:[['Bola','⚽'],['Boneca','🪆'],['Banana','🍌'],['Barco','⛵']],
       distract:[['Casa','🏠'],['Elefante','🐘'],['Foca','🦭'],['Maçã','🍎']] },
  C: { correct:[['Casa','🏠'],['Cavalo','🐴'],['Copo','🥤'],['Coelho','🐰']],
       distract:[['Dado','🎲'],['Rato','🐭'],['Lua','🌙'],['Peixe','🐟']] },
  D: { correct:[['Dado','🎲'],['Dedo','👆'],['Doce','🍬'],['Dinossauro','🦖']],
       distract:[['Gato','🐱'],['Foca','🦭'],['Rato','🐭'],['Vaca','🐄']] },
  F: { correct:[['Foca','🦭'],['Flor','🌸'],['Faca','🔪'],['Foguete','🚀']],
       distract:[['Casa','🏠'],['Lua','🌙'],['Rato','🐭'],['Sol','☀️']] },
  G: { correct:[['Gato','🐱'],['Girafa','🦒'],['Galinha','🐔'],['Guarda-chuva','☂️']],
       distract:[['Bola','⚽'],['Rato','🐭'],['Sol','☀️'],['Vaca','🐄']] },
  L: { correct:[['Lua','🌙'],['Livro','📖'],['Leão','🦁'],['Limão','🍋']],
       distract:[['Casa','🏠'],['Pato','🦆'],['Foca','🦭'],['Rato','🐭']] },
  M: { correct:[['Maçã','🍎'],['Macaco','🐒'],['Mesa','🪑'],['Moto','🏍️']],
       distract:[['Bola','⚽'],['Casa','🏠'],['Rato','🐭'],['Sol','☀️']] },
  P: { correct:[['Pato','🦆'],['Peixe','🐟'],['Pipoca','🍿'],['Panela','🍳']],
       distract:[['Casa','🏠'],['Lua','🌙'],['Rato','🐭'],['Foca','🦭']] },
  S: { correct:[['Sol','☀️'],['Sapo','🐸'],['Sorvete','🍦'],['Sapato','👟']],
       distract:[['Bola','⚽'],['Lua','🌙'],['Rato','🐭'],['Casa','🏠']] },
  T: { correct:[['Tartaruga','🐢'],['Tigre','🐯'],['Tomate','🍅'],['Tesoura','✂️']],
       distract:[['Casa','🏠'],['Lua','🌙'],['Foca','🦭'],['Rato','🐭']] },
  V: { correct:[['Vaca','🐄'],['Vassoura','🧹'],['Vestido','👗'],['Violão','🎸']],
       distract:[['Casa','🏠'],['Foca','🦭'],['Rato','🐭'],['Sol','☀️']] },
};

const LETTERS = Object.keys(BANK);
let currentLetter = null;
let foundCount = 0;
let totalCorrect = 0;
let score = 0;

const playfieldWrap = document.getElementById('playfield-wrap');
const playfield = document.getElementById('playfield');
const centerLetterEl = document.getElementById('centerLetter');
const svg = document.getElementById('lines-svg');
const letterPicker = document.getElementById('letterPicker');
const progressPill = document.getElementById('progressPill');
const scorePill = document.getElementById('scorePill');
const celebrateOverlay = document.getElementById('celebrate-overlay');
const nextBtn = document.getElementById('nextBtn');

function normalizeFirstLetter(word){
  return word.charAt(0)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildLetterPicker(){
  letterPicker.innerHTML = '';
  LETTERS.forEach(l=>{
    const btn = document.createElement('button');
    btn.className = 'letter-chip';
    btn.textContent = l;
    btn.addEventListener('click', ()=> startRound(l));
    letterPicker.appendChild(btn);
  });
}

function setActiveChip(letter){
  [...letterPicker.children].forEach(chip=>{
    chip.classList.toggle('active', chip.textContent === letter);
  });
}

function playTone(freqs, duration=0.12){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let t = ctx.currentTime;
    freqs.forEach(f=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t+duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t+duration);
      t += duration*0.8;
    });
  }catch(e){ /* audio not available, ignore */ }
}

function startRound(letter){
  currentLetter = letter;
  foundCount = 0;
  centerLetterEl.textContent = letter;
  centerLetterEl.classList.remove('pulse');
  void centerLetterEl.offsetWidth;
  centerLetterEl.classList.add('pulse');
  setActiveChip(letter);

  // clear previous bubbles/lines
  playfield.querySelectorAll('.word-bubble').forEach(b=>b.remove());
  svg.innerHTML = '';

  const data = BANK[letter];
  const correctWords = data.correct.map(([w,e])=>({word:w, emoji:e, correct:true}));
  const distractWords = shuffle(data.distract).slice(0,4).map(([w,e])=>({word:w, emoji:e, correct:false}));
  totalCorrect = correctWords.length;

  const allWords = shuffle([...correctWords, ...distractWords]);
  progressPill.textContent = `0 de ${totalCorrect} encontradas`;

  const n = allWords.length;
  allWords.forEach((item, i)=>{
    const bubble = document.createElement('div');
    bubble.className = 'word-bubble';
    bubble.style.setProperty('--bubble-color', BUBBLE_COLORS[i % BUBBLE_COLORS.length]);
    bubble.innerHTML = `<span class="emoji">${item.emoji}</span><span>${item.word}</span>`;
    bubble.dataset.word = item.word;
    bubble.dataset.correct = item.correct ? '1':'0';

    const angle = (i * (360/n) - 90) * Math.PI/180;
    playfield.appendChild(bubble);
    positionBubble(bubble, angle);

    bubble.addEventListener('click', ()=> handleBubbleClick(bubble));
  });
}

function positionBubble(bubble, angle){
  const rect = playfieldWrap.getBoundingClientRect();
  const radius = rect.width * 0.37;
  const cx = rect.width/2;
  const cy = rect.height/2;
  const x = cx + radius * Math.cos(angle);
  const y = cy + radius * Math.sin(angle);
  bubble.style.left = x + 'px';
  bubble.style.top = y + 'px';
  bubble.dataset.angle = angle;
}

function handleBubbleClick(bubble){
  if(bubble.classList.contains('correct')) return;
  const isCorrect = bubble.dataset.correct === '1';

  if(isCorrect){
    bubble.classList.add('correct');
    drawLine(bubble);
    foundCount++;
    score += 10;
    progressPill.textContent = `${foundCount} de ${totalCorrect} encontradas`;
    scorePill.textContent = `⭐ ${score}`;
    playTone([523.25, 659.25, 783.99]);
    if(foundCount === totalCorrect){
      setTimeout(showCelebration, 400);
    }
  } else {
    bubble.classList.remove('wrong');
    void bubble.offsetWidth;
    bubble.classList.add('wrong');
    playTone([180, 140]);
    setTimeout(()=> bubble.classList.remove('wrong'), 450);
  }
}

function drawLine(bubble){
  const wrapRect = playfieldWrap.getBoundingClientRect();
  const cRect = centerLetterEl.getBoundingClientRect();
  const bRect = bubble.getBoundingClientRect();

  const x1 = cRect.left + cRect.width/2 - wrapRect.left;
  const y1 = cRect.top + cRect.height/2 - wrapRect.top;
  const x2 = bRect.left + bRect.width/2 - wrapRect.left;
  const y2 = bRect.top + bRect.height/2 - wrapRect.top;

  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.dataset.word = bubble.dataset.word;
  svg.appendChild(line);
  requestAnimationFrame(()=> line.classList.add('show'));
}

function redrawAllLines(){
  // reposition bubbles that already exist, then redraw correct lines
  playfield.querySelectorAll('.word-bubble').forEach(bubble=>{
    positionBubble(bubble, parseFloat(bubble.dataset.angle));
  });
  const correctBubbles = [...playfield.querySelectorAll('.word-bubble.correct')];
  svg.innerHTML = '';
  correctBubbles.forEach(b=> drawLine(b));
}

let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redrawAllLines, 120);
});

function showCelebration(){
  celebrateOverlay.classList.add('show');
  spawnConfetti();
  playTone([523.25, 659.25, 783.99, 1046.5], 0.16);
}

function spawnConfetti(){
  const card = document.querySelector('.celebrate-card');
  const colors = BUBBLE_COLORS;
  for(let i=0;i<24;i++){
    const c = document.createElement('div');
    c.className = 'confetto';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1 + Math.random()*0.8) + 's';
    c.style.animationDelay = (Math.random()*0.3) + 's';
    card.appendChild(c);
    setTimeout(()=> c.remove(), 2000);
  }
}

nextBtn.addEventListener('click', ()=>{
  celebrateOverlay.classList.remove('show');
  let next = currentLetter;
  while(next === currentLetter){
    next = LETTERS[Math.floor(Math.random()*LETTERS.length)];
  }
  startRound(next);
});

function spawnClouds(){
  const sizes = [90,140,110,70,160];
  sizes.forEach((s,i)=>{
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.width = s+'px';
    cloud.style.height = (s*0.6)+'px';
    cloud.style.top = (Math.random()*70)+'%';
    cloud.style.left = (Math.random()*90)+'%';
    document.body.appendChild(cloud);
  });
}

buildLetterPicker();
spawnClouds();
startRound(LETTERS[Math.floor(Math.random()*LETTERS.length)]);
</script>
</body>
</html>
