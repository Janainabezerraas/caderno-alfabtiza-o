<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shhh! Não acorde o Bento</title>
<style>
:root{
  --bg:#1b2150; --bg2:#2c3a7a; --ink:#f4efe6; --muted:#aab3e0; --moon:#ffe9a8;
  --ok:#7fd6a8; --warn:#ffd36b; --bad:#ff7a7a; --card:rgba(255,255,255,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2150;--bg2:#2c3a7a}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.1}}
.moon{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:20px;width:54px;height:54px;border-radius:50%;
  background:var(--moon);box-shadow:inset -14px -4px 0 0 #e8c86d,0 0 40px rgba(255,233,168,.5)}
h1{font-size:clamp(22px,5vw,34px);margin:22px 16px 4px;text-align:center;font-weight:600}
.sub{margin:0 16px;color:var(--muted);text-align:center;max-width:440px}
#stage{position:relative;width:min(92vw,460px);margin-top:8px}
svg{width:100%;height:auto;display:block}
.zzz{font-weight:700;fill:var(--ink);opacity:0}
.sleeping .zzz{animation:z 3s infinite}
.sleeping .z2{animation-delay:1s}.sleeping .z3{animation-delay:2s}
@keyframes z{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-34px)}}
#chest{transform-origin:230px 230px;animation:br 3.4s infinite ease-in-out}
@keyframes br{50%{transform:scaleY(1.05) scaleX(1.02)}}
.eyes-open,.mouth-o,.mouth-sad{display:none}
.stirring .eyes-closed{display:none}.stirring .eyes-half{display:block}
.awake .eyes-closed,.awake .eyes-half{display:none}.awake .eyes-open,.awake .mouth-o{display:block}
.awake .mouth-z,.stirring .mouth-z{display:none}.stirring .mouth-z2{display:block}
.mouth-z2{display:none}
.eyes-half{display:none}
.awake #baby{animation:shake .25s infinite}
@keyframes shake{25%{transform:translate(-3px,0)}75%{transform:translate(3px,0)}}
.stirring #baby{animation:stir 1s infinite}
@keyframes stir{50%{transform:rotate(-1.5deg)}}
#meter{width:min(86vw,420px);height:26px;border-radius:14px;background:var(--card);overflow:hidden;margin-top:6px;position:relative}
#bar{height:100%;width:0;background:var(--ok);border-radius:14px;transition:width .08s,background .2s}
#status{margin:10px 16px 0;font-size:20px;min-height:30px;text-align:center}
.row{display:flex;gap:14px;margin:14px 0 6px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--card);padding:8px 16px;border-radius:20px;font-size:17px}
button{font:inherit;font-size:20px;font-weight:600;border:0;border-radius:28px;padding:14px 30px;margin:10px 6px;
  background:var(--moon);color:#2a2340;cursor:pointer;min-height:52px}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.ghost{background:var(--card);color:var(--ink)}
.sens{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:24px}
.sens input{width:150px}
#msg{color:var(--bad);max-width:420px;text-align:center;margin:6px 16px}
@media (prefers-reduced-motion:reduce){.stars i{animation:none}}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="moon"></div>
<h1>Shhh! Não acorde o Bento</h1>
<p class="sub">O microfone escuta o tempo todo. Fiquem quietinhos para ele dormir!</p>

<div id="stage" class="sleeping">
<svg viewBox="0 0 460 340" role="img" aria-label="Bebê dormindo na cama">
  <rect x="20" y="250" width="420" height="60" rx="22" fill="#5a4a9a"/>
  <rect x="20" y="236" width="420" height="40" rx="20" fill="#8e7bd6"/>
  <ellipse cx="130" cy="220" rx="90" ry="38" fill="#f4efe6"/>
  <g id="baby">
    <circle cx="140" cy="190" r="62" fill="#ffd9b8"/>
    <path d="M100 150q40-34 80 0q-10-4-40-4t-40 4z" fill="#7a4b2a"/>
    <circle cx="86" cy="196" r="9" fill="#ffd9b8"/><circle cx="194" cy="196" r="9" fill="#ffd9b8"/>
    <circle cx="112" cy="208" r="9" fill="#ffaaa0" opacity=".6"/><circle cx="168" cy="208" r="9" fill="#ffaaa0" opacity=".6"/>
    <g class="eyes-closed" stroke="#3b2a20" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M112 188q10 9 20 0"/><path d="M148 188q10 9 20 0"/></g>
    <g class="eyes-half" stroke="#3b2a20" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M112 190h20"/><path d="M148 190h20"/><circle cx="122" cy="194" r="3" fill="#3b2a20"/><circle cx="158" cy="194" r="3" fill="#3b2a20"/></g>
    <g class="eyes-open"><circle cx="122" cy="188" r="11" fill="#fff"/><circle cx="158" cy="188" r="11" fill="#fff"/>
      <circle cx="122" cy="190" r="6" fill="#3b2a20"/><circle cx="158" cy="190" r="6" fill="#3b2a20"/>
      <path d="M108 170l22 6M172 170l-22 6" stroke="#3b2a20" stroke-width="4" stroke-linecap="round"/></g>
    <path class="mouth-z" d="M130 218q10 6 20 0" stroke="#3b2a20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path class="mouth-z2" d="M132 220q8-4 16 0" stroke="#3b2a20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse class="mouth-o" cx="140" cy="222" rx="13" ry="16" fill="#8a2a2a"/>
  </g>
  <g id="chest"><path d="M190 232q40-36 150-10l60 8v44H190z" fill="#4fa3d9"/>
    <path d="M230 236q30 10 60 0M300 244q30 10 60 0" stroke="#3a86b8" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <text class="zzz z1" x="215" y="150" font-size="34">Z</text>
  <text class="zzz z2" x="245" y="125" font-size="26">z</text>
  <text class="zzz z3" x="270" y="105" font-size="20">z</text>
</svg>
</div>

<div id="meter" aria-hidden="true"><div id="bar"></div></div>
<div id="status" role="status" aria-live="polite">Toque em começar</div>
<div class="row"><div class="pill">Tempo dormindo: <b id="time">0s</b></div><div class="pill">Recorde: <b id="best">0s</b></div></div>
<div id="msg"></div>
<button id="go">Começar</button>
<div class="sens"><label for="sens">Sensibilidade</label><input id="sens" type="range" min="1" max="10" value="5"></div>

<script>
const $=id=>document.getElementById(id);
const stage=$('stage'),bar=$('bar'),status=$('status'),msg=$('msg');
for(let i=0;i<40;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*3+'s';$('stars').appendChild(s)}
let ctx,analyser,data,stream,running=false,level=0,state='sleeping',sleepStart=0,best=0,calm=0,awakeAt=0,raf;
let best0=0;try{best0=+localStorage.getItem('bento-best')||0}catch(e){}
best=best0;$('best').textContent=best+'s';

function setState(s){
  if(s===state)return;state=s;
  stage.className=s;
  if(s==='sleeping'){sleepStart=performance.now();status.textContent='Zzz... dormindo 😴'}
  if(s==='stirring'){status.textContent='Ele está se mexendo... shhh! 🤫'}
  if(s==='awake'){
    const secs=Math.floor((performance.now()-sleepStart)/1000);
    if(secs>best){best=secs;$('best').textContent=best+'s';try{localStorage.setItem('bento-best',best)}catch(e){}}
    status.textContent='Acordou! Buááá 😭 Fiquem quietos para ele voltar a dormir';
    awakeAt=performance.now();calm=0;
  }
}
function tick(){
  analyser.getByteTimeDomainData(data);
  let sum=0;for(const v of data){const d=(v-128)/128;sum+=d*d}
  const rms=Math.sqrt(sum/data.length);
  // suaviza: sobe rápido, desce devagar
  level=rms>level?rms:level*0.92+rms*0.08;
  const sens=+$('sens').value;
  const t=0.22-sens*0.018;            // limite de barulho (menor = mais sensível)
  const pct=Math.min(1,level/(t*1.6));
  bar.style.width=(pct*100)+'%';
  bar.style.background=level<t*.5?'var(--ok)':level<t?'var(--warn)':'var(--bad)';
  const now=performance.now();
  if(state==='sleeping'){
    if(level>t*1.1){awakeStart=now;setState('awake')}
    else if(level>t*.7){setState('stirring')}
    $('time').textContent=Math.floor((now-sleepStart)/1000)+'s';
  }else if(state==='stirring'){
    if(level>t*1.1)setState('awake');
    else if(level<t*.45){calm+=1;if(calm>40){calm=0;setState('sleeping')}}else calm=0;
    $('time').textContent=Math.floor((now-sleepStart)/1000)+'s';
  }else{ // awake: precisa de ~3s de silêncio
    if(level<t*.45){calm+=1;if(calm>180){calm=0;setState('sleeping')}}else calm=0;
  }
  raf=requestAnimationFrame(tick);
}
async function start(){
  msg.textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    msg.textContent='Não consegui acessar o microfone. Permita o acesso no navegador e tente de novo (a página precisa estar em https).';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser();analyser.fftSize=1024;data=new Uint8Array(analyser.fftSize);
  src.connect(analyser);
  running=true;$('go').textContent='Parar';$('go').classList.add('ghost');
  state='';setState('sleeping');
  raf=requestAnimationFrame(tick);
}
function stop(){
  running=false;cancelAnimationFrame(raf);
  stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close();
  bar.style.width='0';stage.className='sleeping';state='sleeping';
  status.textContent='Toque em começar';$('go').textContent='Começar';$('go').classList.remove('ghost');
}
$('go').onclick=()=>running?stop():start();
document.addEventListener('visibilitychange',()=>{if(running&&ctx&&ctx.state==='suspended')ctx.resume()});
</script>
</body>
</html>
